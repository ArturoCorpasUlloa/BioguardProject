services:
  postgres:
    image: postgres:16-alpine
    container_name: bioguard-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: bioguard
      POSTGRES_PASSWORD: bioguard_local_password
      POSTGRES_DB: bioguard
    ports:
      - "5433:5432"
    volumes:
      - bioguard_pgdata:/var/lib/postgresql/data

volumes:
  bioguard_pgdata:
